name: SEO Foundation

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "proxy.ts"
      - "next.config.ts"
      - "scripts/seo-foundation-check.mjs"
      - "package.json"
      - ".github/workflows/seo-foundation.yml"
  push:
    branches:
      - main

jobs:
  seo-foundation:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: SEO static acceptance checks
        run: npm run seo:check

      - name: Production build
        run: npm run build

      - name: Baseline lint audit
        continue-on-error: true
        run: npm run lint
