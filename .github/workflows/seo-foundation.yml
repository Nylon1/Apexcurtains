name: SEO Foundation

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "proxy.ts"
      - "next.config.ts"
      - "scripts/seo-foundation-check.mjs"
      - "scripts/sitemap-check.mjs"
      - "scripts/public-seo-audit.mjs"
      - "scripts/legacy-redirect-check.mjs"
      - "scripts/specialist-guidance-check.mjs"
      - "scripts/visualiser-check.mjs"
      - "scripts/prepare-visualiser-assets.mjs"
      - "scripts/web-app-check.mjs"
      - "scripts/atelier-check.test.ts"
      - "package.json"
      - ".github/workflows/seo-foundation.yml"
  push:
    branches:
      - main

jobs:
  seo-foundation:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: SEO static acceptance checks
        run: npm run seo:check

      - name: Sitemap serialization checks
        run: npm run test:sitemap

      - name: Installable app and private-cache checks
        run: npm run test:web-app

      - name: Atelier material calculations and release validation
        run: npm run test:atelier

      - name: Production build
        run: npm run build

      - name: Legacy URL migration and destination checks
        run: npm run test:redirects

      - name: Specialist guidance and project consistency checks
        run: npm run test:specialist

      - name: Baseline lint audit
        # Existing repository-wide lint findings are audited separately.
        continue-on-error: true
        run: npm run lint

      - name: Visualiser rendering, asset and enquiry checks
        run: npm run test:visualiser
