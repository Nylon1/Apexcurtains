name: SEO Foundation

on:
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "proxy.ts"
      - "next.config.ts"
      - "scripts/seo-foundation-check.mjs"
      - "package.json"
      - ".github/workflows/seo-foundation.yml"
  push:
    branches:
      - main

jobs:
  seo-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: SEO static acceptance checks
        run: npm run seo:check

      - name: Baseline lint audit
        continue-on-error: true
        run: npm run lint
