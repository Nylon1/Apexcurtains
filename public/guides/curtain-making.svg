<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Planning a shaped curtain</title><desc id="desc">Separate panels with unequal slopes, planned joins and allowances at the top and hem.</desc><rect width="960" height="540" fill="#eee9dd"/><path d="M85 245L412 65V435H85Z" fill="#c7b390" stroke="#8b795d" stroke-width="2"/><path d="M552 65L878 280V435H552Z" fill="#c7b390" stroke="#8b795d" stroke-width="2"/><g stroke="#6f735f" stroke-width="2" stroke-dasharray="6 6"><path d="M99 256L398 92V418H99Z" fill="none"/><path d="M566 93L864 291V418H566Z" fill="none"/><path d="M245 159V418M714 179V418"/></g><g fill="#203c35" font-family="Arial,sans-serif" font-size="17"><text x="240" y="33" text-anchor="middle">Left panel</text><text x="715" y="33" text-anchor="middle">Right panel</text><text x="150" y="320">Planned join</text><text x="615" y="320">Planned join</text><text x="480" y="476" text-anchor="middle">Different top lines · heading construction · joins · hem allowances</text><text x="480" y="512" text-anchor="middle" font-size="13">CONCEPT ONLY · NOT DIMENSIONED OR SUITABLE AS A CUTTING PATTERN</text></g></svg>
