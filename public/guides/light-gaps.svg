<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Light paths around lined curtains"><rect width="960" height="540" fill="#eae6da"/><g font-family="Arial,sans-serif" fill="#263c35"><text x="48" y="54" font-size="20">LIGHT THROUGH CLOTH ≠ LIGHT AROUND CLOTH</text><rect x="90" y="100" width="330" height="300" fill="#d3ded7" stroke="#536c60" stroke-width="4"/><path d="M112 123H245V365H112ZM265 123H398V365H265Z" fill="#9b8c73"/><g stroke="#ad7e37" stroke-width="7"><path d="M100 110H410M100 390H410M99 140V360M411 140V360M255 130V360"/></g><text x="480" y="145" font-size="20">01   Above the heading</text><text x="480" y="205" font-size="20">02   Around the side edges</text><text x="480" y="265" font-size="20">03   Between the panels</text><text x="480" y="325" font-size="20">04   Beneath the hem</text><text x="90" y="445" font-size="18">A shorter hem leaves more space below.</text><text x="90" y="480" font-size="18">Floor-length curtains can reduce this gap; clearance and uneven floors still matter.</text></g></svg>